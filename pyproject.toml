[project]
name = "gigaschool-rag"
version = "0.1.0"
description = "Сквозной RAG-проект курса LLM-инженер (GigaSchool)"
requires-python = ">=3.12"
dependencies = [
    "datasketch>=2.0.0",
    "emoji>=2.16.0",
    "httpx>=0.27",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "selectolax>=0.3",
    "sentence-transformers>=6.2.0",
    "torch>=2.11.0",
    "transformers>=5.20.2",
]

[tool.uv.sources]
# Linux — сборка с CUDA 12.8 (RTX 50xx); macOS и прочие — обычные колёса PyPI (CPU/MPS)
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
